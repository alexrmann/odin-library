<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="modalForm.js"></script>
  </head>
  <body>
    <!-- Simple pop-up dialog box with form -->
    <dialog id="dialog" class="dialog flow">
      <button type="button" id="close" class="btn btn--cancel">
        <div class="container--button container--text-with-icon">
          <img class="icon" src="assets/icons/close.svg" alt="" />
          <div class="btn__text">Cancel</div>
        </div>
      </button>
      <form method="dialog" class="flow">
        <fieldset class="flow">
          <legend>Enter book information:</legend>

          <!-- TODO: FIX VALIDATION! -->
          <div class="group--input">
            <label for="title">Title:</label>
            <input type="text" name="title" id="title" required />
          </div>

          <div class="group--input">
            <label for="author">Author:</label>
            <input type="text" name="author" id="author" required />
          </div>

          <div class="group--input">
            <label for="pages">Pages:</label>
            <input type="number" name="pages" id="pages" required />
          </div>

          <div class="group--input">
            <fieldset class="read-status">
              <legend>Read status:</legend>
              <div class="group--input">
                <input
                  type="checkbox"
                  name="read-status"
                  value="read"
                  id="read"
                />
                <label for="read">I have read this book</label>
              </div>
            </fieldset>
          </div>
        </fieldset>
        <button type="submit" class="btn btn--add">
          <div class="container--button container--text-with-icon">
            <img class="icon" src="assets/icons/book-plus.svg" alt="" />
            <div class="btn__text">Add Book</div>
          </div>
        </button>
      </form>
    </dialog>

    <button id="open" class="btn btn--add">
      <div class="container--button container--text-with-icon">
        <img class="icon" src="assets/icons/book-plus.svg" alt="" />
        <div class="btn__text">New Book</div>
      </div>
    </button>
  </body>
</html>
